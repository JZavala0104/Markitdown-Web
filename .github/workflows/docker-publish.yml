name: CI/CD Docker to GHCR

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Iniciar sesión en GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Construir y subir imagen Docker
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true

        tags: ghcr.io/jzavala0104/markitdown-web:latest

  deploy-to-vm:
    needs: build-and-push 
    runs-on: ubuntu-latest
    steps:
      - name: Conectar a la VM por SSH y desplegar
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            # 1. Detener y limpiar contenedores anteriores
            docker stop markitdown-app caddy || true
            docker rm markitdown-app caddy || true
            
            # 2. Crear una red virtual para que los contenedores se comuniquen
            docker network create webnet || true
            
            # 3. Descargar la última versión de tu app
            docker pull ghcr.io/jzavala0104/markitdown-web:latest
            
            # 4. Levantar tu app en la red interna (Ya no exponemos el puerto 80 aquí)
            docker run -d --name markitdown-app --network webnet ghcr.io/jzavala0104/markitdown-web:latest
            
            # 5. Levantar Caddy Server configurado con tu subdominio
            docker run -d --name caddy -p 80:80 -p 443:443 --network webnet \
              -v caddy_data:/data \
              caddy caddy reverse-proxy --from markdown.jogzar.com --to markitdown-app:8000