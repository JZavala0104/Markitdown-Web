name: CI/CD Docker to GHCR

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Iniciar sesión en GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Construir y subir imagen Docker
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true

        tags: ghcr.io/jzavala0104/markitdown-web:latest

  deploy-to-vm:
    needs: build-and-push 
    runs-on: ubuntu-latest
    steps:
      - name: Conectar a la VM por SSH y desplegar
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            # 1. Detener y eliminar el contenedor viejo si existe
            docker stop markitdown-app || true
            docker rm markitdown-app || true
            
            # 2. Descargar la imagen pública más reciente que acaba de crear GitHub
            docker pull ghcr.io/jzavala0104/markitdown-web:latest
            
            # 3. Levantar el nuevo contenedor mapeando el puerto 8000
            docker run -d -p 80:8000 --name markitdown-app ghcr.io/jzavala0104/markitdown-web:latest